# typos — configuração de verificação ortográfica (E13-T09)
# Localmente: `make typos`; no CI, a action `crate-ci/typos`.
#
# O knudge documenta e comenta em **português** (AGENTS.md §0.1); o `typos` é um corretor de
# inglês. Por isso `extend-words` lista o vocabulário pt-BR legítimo (o `typos` casa sem
# diferenciar maiúsculas/minúsculas — basta a forma base). Ao introduzir um termo novo em
# português que o corretor reprove, acrescente-o aqui.

[files]
extend-exclude = [
    "refs/",            # projetos de referência (leitura, não editar)
    "plan/brainstorm/", # registro histórico
    "target/",
    "fuzz/corpus/",
    "fuzz/artifacts/",
    "Cargo.lock",
    "*.gguf",
]

[default]
extend-ignore-re = [
    # ids e hashes do domínio (ex.: fact_01bpivlt)
    "[a-z]+_[0-9a-z]{8}",
    # blocos de código/TOON com identificadores
    "(?s)```.*?```",
]

# Vocabulário pt-BR do projeto (forma base; o match é case-insensitive).
