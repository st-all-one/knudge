# cargo-deny — políticas de supply chain (E13-T09 / R42)
#
# CI falha em advisory, licença fora da lista, duplicação de versão do mesmo crate em famílias
# críticas ou fonte não confiável. Localmente: `cargo deny check` (alvo `make deny`).

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Sem runtime assíncrono pesado no núcleo local (R16/R43).
    "tokio",
    "reqwest",
    "hyper",
    "axum",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
